apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-integrated-gpu
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  rules:
    - name: intel.igpu
      labels:
        feature.node.kubernetes.io/intel-igpu.present: "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class:
              op: In
              value: ["0300"]
            vendor:
              op: In
              value: ["8086"]
