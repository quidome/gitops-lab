apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: usb-conbee2
spec:
  rules:
    - name: usb.conbee2
      labels:
        feature.node.kubernetes.io/usb-conbee2.present: "true"
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            vendor:
              op: In
              value: ["1cf1"]
            device:
              op: In
              value: ["0030"]
