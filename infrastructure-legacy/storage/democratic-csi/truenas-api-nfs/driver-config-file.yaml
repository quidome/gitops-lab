---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-nfs-driver-config
  namespace: democratic-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: truenas-nfs-driver-config
  data:
    - secretKey: driver-config-file.yaml
      remoteRef:
        key: democratic-csi-nfs
        property: driver-config-file.yaml
