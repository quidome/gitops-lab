repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: nginx
    namespace: frontend
    chart: bitnami/nginx
    version: 18.1.0
    values:
      replicaCount: 1
      image:
        repository: docker.io/nginx
        tag: latest
      service:
        type: ClusterIP
        port: 80
      ingress:
        enabled: false
