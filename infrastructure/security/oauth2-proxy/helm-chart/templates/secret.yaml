apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karma-sso.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.clientIDKey }}: {{ .Values.oidc.clientID | quote }}
  {{ .Values.secret.clientSecretKey }}: {{ .Values.oidc.clientSecret | quote }}
  {{ .Values.secret.cookieSecretKey }}: {{ .Values.cookieSecret | quote }}
