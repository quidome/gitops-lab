# Add leader election namespace to prevent RBAC permissions errors
global:
  leaderElection:
    # This should be the same namespace cert-manager is installed into
    namespace: cert-manager
crds:
  enabled: true
  keep: true
# Use the modern, structured configuration for controller settings
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
# extraArgs can still be used for flags not available in the structured config
extraArgs:
  # "--enable-gateway-api" has been moved to the 'config' block above
  - "--dns01-recursive-nameservers-only"
  - "--dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53,9.9.9.9:53"
  - "--dns01-check-retry-period=10s"
  - "--max-concurrent-challenges=60"
  - "--enable-certificate-owner-ref=true"
# Security context for improved container security
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault
# Resource limits for production workloads
resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    memory: 256Mi
webhook:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
cainjector:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 256Mi
