fullnameOverride: vault

server:
  # Standalone mode for home lab
  standalone:
    enabled: true
    config: |
      disable_mlock = true

      # Enable telemetry for Prometheus monitoring
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = false
      }

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        # Allow unauthenticated access to metrics endpoint (Vault 1.18+)
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      storage "file" {
        path = "/vault/data"
      }

      ui = true

  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: truenas-iscsi

  # Resource limits for home lab
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 256Mi

  # Increase readiness probe timeout (default 3s is too short)
  readinessProbe:
    enabled: true
    timeoutSeconds: 10

  # Schedule on kube2 node
  nodeSelector:
    kubernetes.io/hostname: kube2

  # Allow scheduling on control-plane node
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Service configuration for UI access
  service:
    enabled: true
    type: ClusterIP
    port: 8200

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: false
