apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-managed-apps
  namespace: gitops
spec:
  destination:
    namespace: gitops
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sources:
    - path: .
      directory:
        recurse: true
        include: "{application.yaml,applicationset.yaml,*/application.yaml,*/applicationset.yaml}"
        jsonnet: {}
      repoURL: git@github.com:quidome/gitops-lab.git
      targetRevision: main
    - path: .
      directory:
        recurse: true
        include: "{application.yaml,applicationset.yaml,*/application.yaml,*/applicationset.yaml}"
        jsonnet: {}
      repoURL: git@github.com:quidome/gitops-apps.git
      targetRevision: main
