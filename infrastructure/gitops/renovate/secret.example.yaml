apiVersion: v1
kind: Secret
metadata:
  name: renovate-secrets
  namespace: gitops
type: Opaque
stringData:
  # GitHub fine-grained personal access token with repository read/write permissions
  RENOVATE_TOKEN: "github_pat_here"

  # Optional: improves GitHub changelog/release note fetching; may use the same token
  GITHUB_COM_TOKEN: "github_pat_here"
