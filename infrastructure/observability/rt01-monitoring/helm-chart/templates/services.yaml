{{- $root := . -}}
{{- range $name, $exporter := .Values.exporters }}
{{- if $exporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rt01-monitoring.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "rt01-monitoring.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $exporter.port }}
      targetPort: {{ $exporter.port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ include "rt01-monitoring.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "rt01-monitoring.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-exporter
    kubernetes.io/service-name: {{ include "rt01-monitoring.fullname" $root }}-{{ $name }}
addressType: IPv4
ports:
  - name: metrics
    port: {{ $exporter.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ $root.Values.rt01.address | quote }}
    conditions:
      ready: true
    hostname: {{ $root.Values.rt01.host | quote }}
{{- end }}
{{- end }}
