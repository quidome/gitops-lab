{{- if .Values.serviceMonitor.enabled }}
{{- $root := . -}}
{{- range $name, $exporter := .Values.exporters }}
{{- if $exporter.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rt01-monitoring.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "rt01-monitoring.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-exporter
    {{- with $root.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}-exporter
  endpoints:
    - port: metrics
      path: {{ $exporter.path }}
      interval: {{ $root.Values.scrape.interval }}
      scrapeTimeout: {{ $root.Values.scrape.timeout }}
      relabelings:
        - targetLabel: instance
          replacement: {{ $root.Values.rt01.labels.instance | quote }}
        - targetLabel: role
          replacement: {{ $root.Values.rt01.labels.role | quote }}
        - targetLabel: network
          replacement: {{ $root.Values.rt01.labels.network | quote }}
        - targetLabel: exporter
          replacement: {{ $name | quote }}
{{- end }}
{{- end }}
{{- end }}
