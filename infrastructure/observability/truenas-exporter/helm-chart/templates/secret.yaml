apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truenas-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "truenas.apiKey is required" .Values.truenas.apiKey | quote }}
