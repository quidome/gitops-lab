apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenas-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "truenas-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "truenas-exporter.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config.file=/etc/json-exporter/config.yml
          ports:
            - name: metrics
              containerPort: 7979
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/json-exporter
              readOnly: true
            - name: api-key
              mountPath: /etc/truenas
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "truenas-exporter.fullname" . }}
        - name: api-key
          secret:
            secretName: {{ include "truenas-exporter.fullname" . }}
