# Image configuration
image:
  repository: prompve/prometheus-pve-exporter
  tag: "3.8.3"
  pullPolicy: IfNotPresent

# Proxmox connection configuration
proxmox:
  host: ""      # Required: proxmox.example.com (hostname/IP for scrape target)
  user: ""      # Required: monitoring@pve (username portion)
  tokenName: "" # Required: prometheus (token name portion)
  tokenValue: "" # Required: UUID token value
  verifyTls: true  # Set false for self-signed certs

# Resource limits
resources:
  requests:
    cpu: 15m
    memory: 128Mi
  limits:
    memory: 128Mi

# Probes
livenessProbe:
  httpGet:
    path: /
    port: 9221
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: 9221
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

# Service configuration
service:
  type: ClusterIP
  port: 9221
  targetPort: 9221

# ServiceMonitor configuration
serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}

# Dashboard configuration
dashboard:
  enabled: false
  gnetId: 10347
  revision: 1
  datasource: Prometheus
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"

# Security context (pod-level)
securityContext:
  runAsNonRoot: true
  runAsUser: 65534  # nobody user
  runAsGroup: 65534
  fsGroup: 65534

# Pod annotations
podAnnotations: {}

# Node selector, affinity, tolerations
nodeSelector: {}
affinity: {}
tolerations: []
