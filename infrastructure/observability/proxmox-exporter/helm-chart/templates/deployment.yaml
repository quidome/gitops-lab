apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxmox-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "proxmox-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "proxmox-exporter.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: exporter
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: PVE_USER
          value: {{ .Values.proxmox.tokenId | quote }}
        - name: PVE_TOKEN_NAME
          value: {{ .Values.proxmox.tokenId | quote }}
        - name: PVE_PASSWORD
          value: {{ .Values.proxmox.secret | quote }}
        - name: PVE_VERIFY_SSL
          value: {{ .Values.proxmox.verifyTls | quote }}
        args:
        - {{ .Values.proxmox.endpoint }}
        ports:
        - name: metrics
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
