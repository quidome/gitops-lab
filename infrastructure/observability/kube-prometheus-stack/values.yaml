# ============================================================================
# Global Configuration
# ============================================================================

defaultRules:
  create: true  # Include default PrometheusRules (alerts)

# Own rules for platform parts that have no chart of their own
additionalPrometheusRulesMap:
  # k3s client and server certificates live 365 days. k3s renews them only when
  # it starts and they expire within 120 days. Needs --supervisor-metrics on the
  # k3s server (nixos-config): k3s then adds k3s_certificate_expiration_seconds
  # to the /metrics that the apiserver job scrapes. min by: the same metric can
  # come from more than one scrape job.
  k3s-certificates:
    groups:
      - name: k3s-certificates
        rules:
          - alert: K3sCertificateExpiresSoon
            expr: |
              min by (subject, usage) (k3s_certificate_expiration_seconds) < 45 * 86400
              unless
              min by (subject, usage) (k3s_certificate_expiration_seconds) < 14 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "k3s certificate {{ $labels.subject }} expires in {{ $value | humanizeDuration }}"
              description: >-
                Restart k3s on the node (sudo systemctl restart k3s): k3s renews
                certificates that expire within 120 days when it starts. Then run
                `just kubeconfig` on the workstation. See docs/services/k3s.md.
          - alert: K3sCertificateExpiresVerySoon
            expr: |
              min by (subject, usage) (k3s_certificate_expiration_seconds) < 14 * 86400
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: "k3s certificate {{ $labels.subject }} expires in {{ $value | humanizeDuration }}"
              description: >-
                When it expires, parts of the cluster stop working. Restart k3s on
                the node now (sudo systemctl restart k3s), then run `just kubeconfig`.
                See docs/services/k3s.md.
          - alert: K3sCertificateMetricMissing
            expr: absent(k3s_certificate_expiration_seconds)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: No k3s certificate expiry data
              description: >-
                Prometheus gets no k3s_certificate_expiration_seconds, so the k3s
                certificate alerts do not work. Check that k3s on kube2 runs with
                --supervisor-metrics (nixos-config).

# ============================================================================
# Prometheus Configuration
# ============================================================================

prometheus:
  enabled: true

  prometheusSpec:
    # URL in alert links ("Source"); without it the in-cluster service name is used
    externalUrl: https://prometheus.quido.me

    # Retention and storage
    retention: 30d
    retentionSize: "14GB"  # ~90% of 15Gi PVC

    # CRITICAL: Use iSCSI block storage to prevent WAL corruption
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 15Gi

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        memory: 2Gi

    # Scrape configuration
    scrapeInterval: 60s
    scrapeTimeout: 10s
    evaluationInterval: 60s

    # ServiceMonitor discovery (cluster-wide, all namespaces)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}  # Match all ServiceMonitors
    serviceMonitorNamespaceSelector: {}  # Watch all namespaces

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # PrometheusRule discovery
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

    # Probe configuration (adjust for slow storage)
    readinessProbeInitialDelaySeconds: 30
    livenessProbeInitialDelaySeconds: 60

# ============================================================================
# AlertManager Configuration
# ============================================================================

alertmanager:
  enabled: true

  alertmanagerSpec:
    # URL in notification links; without it the in-cluster service name is used
    externalUrl: https://alertmanager.quido.me

    # Storage (minimal, alerts are ephemeral)
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi

    # Probes
    readinessProbeInitialDelaySeconds: 10
    livenessProbeInitialDelaySeconds: 30

  # Alertmanager configuration (receivers defined in secrets.yaml.gotmpl for token injection)
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Critical: Pushover priority 1 (high), a reminder every 12 h
        - receiver: pushover
          matchers:
            - severity=critical
          continue: false
        # Warning: Pushover priority -1 (no sound), a reminder each day
        - receiver: pushover-low
          matchers:
            - severity=warning
          repeat_interval: 24h
          continue: false

    # Receivers defined in secrets.yaml.gotmpl (Helm replaces arrays, doesn't merge)

# ============================================================================
# Grafana Configuration
# ============================================================================

grafana:
  enabled: true

  # Admin password injected via Vals in helmfile.yaml.gotmpl
  adminUser: admin
  # Persistence
  persistence:
    enabled: true
    storageClassName: truenas-iscsi
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # Deployment strategy for RWO PVC
  deploymentStrategy:
    type: Recreate

  # Resource limits
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1Gi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://grafana.quido.me
      serve_from_sub_path: false

    security:
      admin_user: admin

    auth:
      disable_login_form: false

    # Native Pocket ID OIDC. The client credentials are mounted from a
    # Vault-backed Secret so they are not stored in grafana.ini/ConfigMap.
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      allow_sign_up: true
      scopes: openid profile email
      auth_url: https://id.quido.me/authorize
      token_url: https://id.quido.me/api/oidc/token
      api_url: https://id.quido.me/api/oidc/userinfo
      signout_redirect_url: https://id.quido.me/api/oidc/end-session?post_logout_redirect_uri=https%3A%2F%2Fgrafana.quido.me%2Flogin
      client_id: '$__file{/etc/secrets/auth_generic_oauth/client_id}'
      client_secret: '$__file{/etc/secrets/auth_generic_oauth/client_secret}'
      use_pkce: true
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name

  # The Secret is created by extraManifests in secrets.yaml.gotmpl.
  extraSecretMounts:
    - name: auth-generic-oauth
      secretName: grafana-auth-generic-oauth
      mountPath: /etc/secrets/auth_generic_oauth
      defaultMode: 0440
      readOnly: true

  users:
    allow_sign_up: false

  # Probes (Grafana can be slow to start with dashboard imports)
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

  # Dashboard providers (for sidecar)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      # Chart auto-creates Prometheus datasource

  # Dashboard imports from Grafana.com (handled by chart)
  dashboards:
    default:
      # Kubernetes cluster overview
      kubernetes-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus

      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus

      # Kubernetes pods
      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

# ============================================================================
# Prometheus Operator Configuration
# ============================================================================

prometheusOperator:
  enabled: true

  # Resource limits for Operator pod
  resources:
    requests:
      cpu: 20m
      memory: 200Mi
    limits:
      memory: 200Mi

  # CRD management
  manageCrds: true  # Operator manages CRD lifecycle

# ============================================================================
# Exporters Configuration
# ============================================================================

# Node Exporter (collects node metrics)
nodeExporter:
  enabled: true

# Node Exporter subchart configuration
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      memory: 50Mi

# Kube State Metrics (K8s object metrics)
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  # The standard volume alerts (KubePersistentVolumeFillingUp) skip volume
  # claims with the label excluded_from_alerts: "true". They can only see the
  # label when kube-state-metrics exports it. Used for the fixed media volumes
  # on the TrueNAS pool bigdata: the truenas-exporter alerts on the pool.
  metricLabelsAllowlist:
    - persistentvolumeclaims=[excluded_from_alerts]
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# ============================================================================
# Disabled Components
# ============================================================================

kubeProxy:
  enabled: false  # Cilium replaces kube-proxy

kubeEtcd:
  enabled: false  # Not exposed in k3s

kubeScheduler:
  enabled: false  # Embedded in k3s server binary

kubeControllerManager:
  enabled: false  # Embedded in k3s server binary

coreDns:
  enabled: true
