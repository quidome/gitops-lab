# ============================================================================
# Global Configuration
# ============================================================================

defaultRules:
  create: true  # Include default PrometheusRules (alerts)

# ============================================================================
# Prometheus Configuration
# ============================================================================

prometheus:
  enabled: true

  prometheusSpec:
    # Retention and storage
    retention: 30d
    retentionSize: "14GB"  # ~90% of 15Gi PVC

    # CRITICAL: Use iSCSI block storage to prevent WAL corruption
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 15Gi

    # Resource limits
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 2Gi

    # Scrape configuration
    scrapeInterval: 60s
    scrapeTimeout: 10s
    evaluationInterval: 60s

    # ServiceMonitor discovery (cluster-wide, all namespaces)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}  # Match all ServiceMonitors
    serviceMonitorNamespaceSelector: {}  # Watch all namespaces

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # PrometheusRule discovery
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

    # Probe configuration (adjust for slow storage)
    readinessProbeInitialDelaySeconds: 30
    livenessProbeInitialDelaySeconds: 60

# ============================================================================
# AlertManager Configuration
# ============================================================================

alertmanager:
  enabled: true

  alertmanagerSpec:
    # Storage (minimal, alerts are ephemeral)
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    # Resource limits
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi

    # Probes
    readinessProbeInitialDelaySeconds: 10
    livenessProbeInitialDelaySeconds: 30

  # Alertmanager configuration (receivers defined in secrets.yaml.gotmpl for token injection)
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: ntfy
          matchers:
            - severity=critical
          mute_time_intervals:
            - quiet-hours
          continue: false

    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: "http://ntfy.observability.svc.cluster.local/alerts"
            send_resolved: true

    time_intervals:
      - name: quiet-hours
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
            location: Europe/Amsterdam
          - times:
              - start_time: "00:00"
                end_time: "08:00"
            location: Europe/Amsterdam

# ============================================================================
# Grafana Configuration
# ============================================================================

grafana:
  enabled: true

  # Admin password injected via Vals in helmfile.yaml.gotmpl
  adminUser: admin
  # Persistence
  persistence:
    enabled: true
    storageClassName: truenas-iscsi
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # Deployment strategy for RWO PVC
  deploymentStrategy:
    type: Recreate

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      memory: 300Mi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://grafana.quido.me
      serve_from_sub_path: false

    security:
      admin_user: admin

    auth:
      disable_login_form: false

    users:
      allow_sign_up: false

  # Probes (Grafana can be slow to start with dashboard imports)
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

  # Dashboard providers (for sidecar)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      # Chart auto-creates Prometheus datasource

  # Dashboard imports from Grafana.com (handled by chart)
  dashboards:
    default:
      # Kubernetes cluster overview
      kubernetes-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus

      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus

      # Kubernetes pods
      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

# ============================================================================
# Prometheus Operator Configuration
# ============================================================================

prometheusOperator:
  enabled: true

  # Resource limits for Operator pod
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      memory: 200Mi

  # CRD management
  manageCrds: true  # Operator manages CRD lifecycle

# ============================================================================
# Exporters Configuration
# ============================================================================

# Node Exporter (collects node metrics)
nodeExporter:
  enabled: true

  # Resource limits per DaemonSet pod
  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      memory: 50Mi

# Kube State Metrics (K8s object metrics)
kubeStateMetrics:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# ============================================================================
# Disabled Components
# ============================================================================

kubeProxy:
  enabled: false  # Cilium replaces kube-proxy

kubeEtcd:
  enabled: false  # Not exposed in k3s

kubeScheduler:
  enabled: true

kubeControllerManager:
  enabled: true

coreDns:
  enabled: true
