image:
  repository: ghcr.io/prymitive/karma
  tag: v0.126
  pullPolicy: IfNotPresent

config:
  alertmanager:
    interval: 30s
    servers:
      - name: k3s
        uri: http://alertmanager-operated.observability.svc.cluster.local:9093

  alertAcknowledgement:
    enabled: true
    duration: 30m
    author: operator
    comment: "ACK via Karma"

  listen:
    address: "0.0.0.0"
    port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 64Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
