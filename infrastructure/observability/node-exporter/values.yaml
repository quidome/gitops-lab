# DaemonSet configuration
hostNetwork: true
hostPID: true

# Resource limits
resources:
  limits:
    cpu: 100m
    memory: 50Mi
  requests:
    cpu: 50m
    memory: 30Mi

# Prometheus scrape annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"

# Service for Prometheus to discover
service:
  type: ClusterIP
  port: 9100
