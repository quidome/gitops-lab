apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-integrated-gpu
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  rules:
    # High-performance Intel iGPU: Alder Lake-N (modern QuickSync, AV1/HEVC support)
    - name: intel.igpu.high-performance
      labels:
        feature.node.kubernetes.io/intel-igpu.present: "true"
        feature.node.kubernetes.io/intel-igpu.tier: "high"
        feature.node.kubernetes.io/intel-igpu.model: "alder-lake-n"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class:
              op: In
              value: ["0300"]
            vendor:
              op: In
              value: ["8086"]
            device:
              op: In
              value: ["46d4"]
    # Low-performance Intel iGPU: Iris Pro 580 (legacy QuickSync, limited codecs)
    - name: intel.igpu.low-performance
      labels:
        feature.node.kubernetes.io/intel-igpu.present: "true"
        feature.node.kubernetes.io/intel-igpu.tier: "low"
        feature.node.kubernetes.io/intel-igpu.model: "iris-pro-580"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class:
              op: In
              value: ["0300"]
            vendor:
              op: In
              value: ["8086"]
            device:
              op: In
              value: ["193b"]
