# Redirect all plain HTTP traffic to HTTPS. App routes attach only to the
# https listener (sectionName: https), so these are the only routes on the
# http listeners.
# The routes have no hostnames, so External DNS would use the listener hostname
# *.quido.me and write records that Technitium cannot handle (a-*.quido.me).
# The label makes External DNS skip them (labelFilter in external-dns/values.yaml).
{{- range list "gateway-internal" "gateway-external" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ . }}-https-redirect
  labels:
    external-dns: ignore
spec:
  parentRefs:
    - name: {{ . }}
      namespace: networking
      sectionName: http
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
