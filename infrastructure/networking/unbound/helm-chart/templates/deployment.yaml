apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      initContainers:
        - name: prepare-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp /config/unbound.conf /workdir/unbound.conf
              /opt/unbound/sbin/unbound-anchor -a /workdir/root.key
              chown -R 1000:1000 /workdir
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: workdir
              mountPath: /workdir
      containers:
        - name: unbound
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: workdir
              mountPath: /opt/unbound/etc/unbound
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 5
        {{- if .Values.monitoring.enabled }}
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              cat >/tmp/unbound-exporter.pl <<'PERL'
              use strict;
              use warnings;
              use IO::Socket::INET;

              my $server = IO::Socket::INET->new(
                LocalAddr => '0.0.0.0',
                LocalPort => {{ .Values.monitoring.port }},
                Proto => 'tcp',
                Listen => 16,
                Reuse => 1,
              ) or die "listen failed: $!\n";

              while (my $client = $server->accept()) {
                $client->recv(my $request, 4096);
                my $stats = `/opt/unbound/sbin/unbound-control -c /opt/unbound/etc/unbound/unbound.conf stats_noreset 2>&1`;
                my $ok = ($? == 0);
                my $body = "";

                if ($ok) {
                  for my $line (split /\n/, $stats) {
                    next unless $line =~ /^([A-Za-z0-9_.-]+)=([0-9.eE+-]+)$/;
                    my ($name, $value) = ($1, $2);
                    $name =~ s/[^A-Za-z0-9_]/_/g;
                    $body .= "unbound_${name} ${value}\n";
                  }
                } else {
                  $body = $stats;
                }

                my $status = $ok ? "200 OK" : "500 Internal Server Error";
                print $client "HTTP/1.1 $status\r\n";
                print $client "Content-Type: text/plain; version=0.0.4\r\n";
                print $client "Content-Length: " . length($body) . "\r\n\r\n";
                print $client $body;
                close $client;
              }
              PERL
              exec perl /tmp/unbound-exporter.pl
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
              protocol: TCP
          volumeMounts:
            - name: workdir
              mountPath: /opt/unbound/etc/unbound
          resources:
            {{- toYaml .Values.monitoring.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: workdir
          emptyDir: {}
