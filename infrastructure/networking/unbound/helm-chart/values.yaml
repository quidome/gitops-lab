replicaCount: 2

image:
  repository: docker.io/mvance/unbound
  tag: "1.22.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Pinned so Pi-hole can use Unbound directly without resolving a Service DNS name during startup.
  clusterIP: 10.43.167.15
  port: 53

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 64Mi

monitoring:
  enabled: true
  port: 9167
  interval: 30s
  scrapeTimeout: 10s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 32Mi

unbound:
  verbosity: 1
  cache:
    msgCacheSize: 32m
    rrsetCacheSize: 64m
