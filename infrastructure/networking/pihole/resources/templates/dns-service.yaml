apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.dnsVip.name }}
  labels:
    app: pihole
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.dnsVip.loadBalancerIP }}
  externalTrafficPolicy: Cluster
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
  selector:
    app: pihole
