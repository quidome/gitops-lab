strategy:
  type: Recreate

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 128Mi

DNS1: 10.43.167.15
DNS2:
persistentVolumeClaim:
  enabled: true
  storageClass: truenas-nfs
  size: 1Gi
serviceDns:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
serviceDhcp:
  enabled: false
replicaCount: 1

monitoring:
  podMonitor:
    enabled: true
  sidecar:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

extraEnvVars:
  FTLCONF_dns_rateLimit_count: 0
  FTLCONF_dns_rateLimit_interval: 0

dnsmasq:
  customDnsEntries:
    - address=/lan.quido.me/172.16.40.78
    - address=/web.quido.me/172.16.40.68
    - address=/grafana.quido.me/172.16.40.68
    - address=/overseerr.quido.me/172.16.40.68
    - address=/plex.quido.me/172.16.40.68
    - address=/proxy.quido.me/172.16.40.68
  customSettings:
    otherSettings: |
      local=/quido.me/
