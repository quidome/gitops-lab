apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
provisioner: org.democratic-csi.nfs
parameters:
  fsType: nfs
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - noatime
  - nfsvers=4
