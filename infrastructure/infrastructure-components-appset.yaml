apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-components
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  generators:
    - git:
        repoURL: git@github.com:quidome/gitops-lab.git
        revision: HEAD
        directories:
          - path: infrastructure/networking/*
          - path: infrastructure/storage/*
          - path: infrastructure/controllers/*
  template:
    metadata:
      name: "{{path.basename}}"
      labels:
        type: infrastructure
    spec:
      project: default
      source:
        plugin:
          name: kustomize-build-with-helm
        repoURL: git@github.com:quidome/gitops-lab.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      syncPolicy: {}
        # automated: {}
        # retry:
        #   limit: 5
        #   backoff:
        #     duration: 5s
        #     factor: 2
        #     maxDuration: 3m
        # syncOptions:
        #   - CreateNamespace=true
        #   - ServerSideApply=true
