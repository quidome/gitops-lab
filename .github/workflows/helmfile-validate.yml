name: Helmfile Validate

on:
  pull_request:
    paths:
      - '**/helmfile.yaml'
      - '**/helmfile.yaml.gotmpl'
      - '**/values.yaml'
      - '**/values-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helmfile-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Helmfile
        run: |
          set -euo pipefail
          HELMFILE_VERSION=v0.168.0
          curl -fsSL -o /tmp/helmfile.tar.gz "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo mv /tmp/helmfile /usr/local/bin/helmfile
          helmfile --version

      - name: Install helm-diff plugin
        run: helm plugin install https://github.com/databus23/helm-diff --verify=false || true

      - name: Validate Helmfiles
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "Validating $f"
            helmfile -f "$f" lint
          done < <(find . -type f \( -name 'helmfile.yaml' -o -name 'helmfile.yaml.gotmpl' \))
