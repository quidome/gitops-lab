name: Helmfile Validate

on:
  pull_request:
    paths:
      - '**/helmfile.yaml'
      - '**/helmfile.yaml.gotmpl'
      - '**/values.yaml'
      - '**/values-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helmfile-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Helmfile
        uses: helmfile/helmfile-action@v2.0.4
        with:
          helmfile-version: v0.168.0

      - name: Validate Helmfiles
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "Validating $f"
            helmfile -f "$f" lint
          done < <(find . -type f \( -name 'helmfile.yaml' -o -name 'helmfile.yaml.gotmpl' \))
