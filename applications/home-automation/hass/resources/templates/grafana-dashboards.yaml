# Grafana dashboards for Home Assistant, loaded by the Grafana sidecar
# (label grafana_dashboard, folder from the grafana_folder annotation).
# The JSON in dashboards/ is the source; edit it there, not in the Grafana UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hass-grafana-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Home"
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
