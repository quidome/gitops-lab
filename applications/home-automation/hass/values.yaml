fullnameOverride: hass

# Home Assistant configuration
# Chart: https://github.com/pajikos/home-assistant-helm-chart

# Use StatefulSet for stable pod identity and persistence
controller:
  type: StatefulSet

image:
  repository: ghcr.io/home-assistant/home-assistant
  pullPolicy: IfNotPresent
  # tag defaults to chart appVersion

# Service configuration
service:
  type: ClusterIP
  port: 8123

# Persistence for Home Assistant config/data
persistence:
  enabled: true
  storageClass: truenas-iscsi
  accessMode: ReadWriteOnce
  size: 5Gi

# Resource limits for home lab
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Security context
securityContext:
  privileged: true  # Required for USB device access
  readOnlyRootFilesystem: false

podSecurityContext:
  runAsNonRoot: false  # HA needs root for some integrations
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# Probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5

# Home Assistant configuration injection
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - 10.42.0.0/16
  # Override templateConfig to include http block unconditionally
  # (default template only renders it when ingress is enabled)
  templateConfig: |-
    default_config:
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        {{- range .Values.configuration.trusted_proxies }}
        - {{ . }}
        {{- end }}
    frontend:
      themes: !include_dir_merge_named themes
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

# Prefer node with P1 meter USB adapter
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: feature.node.kubernetes.io/usb-p1-meter.present
              operator: In
              values:
                - "true"

# Environment variables
env:
  - name: TZ
    value: "Europe/Amsterdam"

# Mount P1 meter USB device
additionalVolumes:
  - name: p1-meter
    hostPath:
      path: /dev/ttyUSB0
      type: CharDevice

additionalMounts:
  - name: p1-meter
    mountPath: /dev/ttyUSB0
