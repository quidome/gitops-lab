persistence:
  enabled: true
  storageClass: truenas-nfs
  size: 256Mi

service:
  type: LoadBalancer
  loadBalancerIP: 172.16.40.51
  ports:
    mqtt:
      port: 1883
    websocket:
      enabled: false

config: |
  persistence true
  persistence_location /mosquitto/data/
  log_dest stdout
  listener 1883
  allow_anonymous false
  password_file /mosquitto/config/passwordfile

livenessProbe:
  tcpSocket:
    port: 1883
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 1883
  initialDelaySeconds: 5
  periodSeconds: 10

extraVolumeMounts:
  - name: auth
    mountPath: /mosquitto/config/passwordfile
    subPath: passwordfile
    readOnly: true

extraVolumes:
  - name: auth
    secret:
      secretName: mosquitto-auth
