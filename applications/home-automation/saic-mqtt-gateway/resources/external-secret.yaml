apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saic-mqtt-gateway
  namespace: home-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: saic-mqtt-gateway
  dataFrom:
    - extract:
        key: home-automation/saic-mqtt-gateway
        conversionStrategy: Default
        decodingStrategy: None
