apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freshrss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freshrss
    spec:
      containers:
        - name: freshrss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: TZ
              value: "Europe/Lisbon"
            - name: FRESHRSS_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: freshrss-auth
                  key: FRESHRSS_USER
            - name: FRESHRSS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-auth
                  key: FRESHRSS_PASSWORD
            - name: FRESHRSS_INSTALL
              value: "--api-enabled --base-url https://rss.quido.me --default-user $FRESHRSS_ADMIN_USERNAME"
            - name: FRESHRSS_USER
              value: "--user $FRESHRSS_ADMIN_USERNAME --password $FRESHRSS_ADMIN_PASSWORD"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
