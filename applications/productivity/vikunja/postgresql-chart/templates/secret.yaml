apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vikunja-postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vikunja-postgresql.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
data:
  password: {{ .Values.postgres.password | b64enc | quote }}
