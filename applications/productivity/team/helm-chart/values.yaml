fullnameOverride: team

# Images are pinned to the multi-architecture OCI indexes published for the
# verified Team source revision ec35e78.
image:
  repository: ghcr.io/quidome/team
  digest: sha256:852068913108c2b7b252c0cf693813a8b1a531fdb5932f0b017db058a120ece2
  pullPolicy: IfNotPresent

migrationImage:
  repository: ghcr.io/quidome/team
  digest: sha256:beb51b0d8b383c1293a352eedd114433599800cc4e3b19d1c8ad504c1c0c092e
  pullPolicy: IfNotPresent

# Deployment-time values. Secret values are supplied by Helmfile/Vals.
databaseUrl: ""
oidcClientSecret: ""
sessionSecret: ""

origin: https://team.quido.me
oidc:
  issuerUrl: https://id.quido.me
  clientId: team-coordinator
sessionTtlSeconds: 28800

replicaCount: 1

service:
  port: 3000
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

migrationResources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 900
