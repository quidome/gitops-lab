fullnameOverride: team

# Images are pinned to the multi-architecture OCI indexes published for the
# verified Team source revision 76e1b1d.
image:
  repository: ghcr.io/quidome/team
  digest: sha256:c1ac7d7d8915cf88668418147cf19ad6ca5058c9c171709dec1e353ac056a40c
  pullPolicy: IfNotPresent

migrationImage:
  repository: ghcr.io/quidome/team
  digest: sha256:07c15d909ee57e8adf424bea1a5abb9e2210baf90d1c5530d9eaf50e43e2cab5
  pullPolicy: IfNotPresent

# Deployment-time values. Secret values are supplied by Helmfile/Vals.
databaseUrl: ""
oidcClientSecret: ""
sessionSecret: ""

origin: https://team.quido.me
oidc:
  issuerUrl: https://id.quido.me
  clientId: team-coordinator
sessionTtlSeconds: 28800

replicaCount: 1

service:
  port: 3000
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

migrationResources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 900
