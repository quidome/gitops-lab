fullnameOverride: team

# Dev phase: tracks the mutable `latest` tag with pullPolicy Always so a plain
# `kubectl rollout restart` (or pod delete) always picks up whatever is newest
# on GHCR. Switch back to digest pinning (see git history) before production.
image:
  repository: ghcr.io/quidome/team
  tag: latest
  pullPolicy: Always

migrationImage:
  repository: ghcr.io/quidome/team
  tag: latest-migration
  pullPolicy: Always

# Deployment-time values. Secret values are supplied by Helmfile/Vals.
databaseUrl: ""
oidcClientSecret: ""
sessionSecret: ""

origin: https://team.quido.me
oidc:
  issuerUrl: https://id.quido.me
  clientId: team-coordinator
sessionTtlSeconds: 28800

replicaCount: 1

service:
  port: 3000
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

migrationResources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 900
