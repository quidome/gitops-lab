apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: team
    app.kubernetes.io/part-of: team
spec:
  hostnames:
    - team.quido.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: team
          port: 3000
          weight: 1
