apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "team-postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "team-postgresql.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  serviceName: {{ include "team-postgresql.fullname" . }}-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "team-postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "team-postgresql.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-password
              mountPath: /run/secrets/postgres
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.username | quote }} -d {{ .Values.postgres.database | quote }} -h 127.0.0.1 -p {{ .Values.service.port }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.username | quote }} -d {{ .Values.postgres.database | quote }} -h 127.0.0.1 -p {{ .Values.service.port }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.username | quote }} -d {{ .Values.postgres.database | quote }} -h 127.0.0.1 -p {{ .Values.service.port }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
      volumes:
        - name: postgres-password
          secret:
            secretName: {{ include "team-postgresql.fullname" . }}
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "team-postgresql.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.data.accessModes | nindent 10 }}
        storageClassName: {{ .Values.data.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.data.size }}
