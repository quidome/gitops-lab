apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources:
#   - http-route.yaml

resources:
  - sealedSecret.yaml

helmCharts:
  - name: zigbee2mqtt
    repo: https://charts.zigbee2mqtt.io
    version: "1.37.1"
    namespace: zigbee2mqtt
    releaseName: zigbee2mqtt
    valuesFile: values.yaml
    valuesInline:
      statefulset:
        secrets:
          name: secrets
        nodeSelector:
          feature.node.kubernetes.io/usb-conbee2.present: "true"
