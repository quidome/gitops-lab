zigbee2mqtt:
  advanced:
    channel: 25
  timezone: Europe/Amsterdam
  mqtt:
    server: mqtt://srv02.lan.balti.casa:1883
    user: "!secret MQTT_USERNAME"
    password: "!secret MQTT_PASSWORD"
  serial:
    port: /dev/ttyACM0
    adapter: deconz
statefulset:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    feature.node.kubernetes.io/usb-conbee2.present: "true"
  secrets:
    name: zigbee2mqtt
  storage:
    enabled: true
    storageClassName: truenas-nfs
  volumeMounts:
    - name: ttyacm
      mountPath: /dev/ttyACM0
  volumes:
    - name: ttyacm
      hostPath:
        path: /dev/ttyACM0
        type: ""
extraResources:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: zigbee2mqtt
      namespace: zigbee2mqtt
    spec:
      encryptedData:
        secret.yaml: 
      template:
        metadata:
          name: zigbee2mqtt
          namespace: zigbee2mqtt
        type: Opaque
