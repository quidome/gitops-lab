zigbee2mqtt:
  advanced:
    channel: 25
  timezone: Europe/Amsterdam
  mqtt:
    server: mqtt://srv02.lan.balti.casa:1883
    # user: "!secrets MQTT_USERNAME"
    # password: "!secrets MQTT_PASSWORD"
  # serial:
    # port: /dev/ttyACM0
statefulset:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    feature.node.kubernetes.io/usb-conbee2.present: "true"
  secrets:
    name: secrets
  # storage:
  #   enabled: true
  #   storageClassName: truenas-nfs
  volumeMounts:
    - name: ttyacm
      mountPath: /dev/ttyACM0
  volumes:
    - name: ttyacm
      hostPath:
        path: /dev/ttyACM0
        type: ""
extraResources:
 -  apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: secrets
      namespace: zigbee2mqtt
    spec:
      encryptedData:
        secrets.yaml: 
      template:
        metadata:
          name: secrets
          namespace: zigbee2mqtt
        type: Opaque
